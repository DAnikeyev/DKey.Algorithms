name: Pull Request Workflow

on:
  pull_request:
    branches: [main]

jobs:

  build:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Verify formatting
      run: dotnet format DKey.Algorithms.sln --verify-no-changes

    - name: Execute unit tests
      run: dotnet test --collect:"XPlat Code Coverage"

    - name: Coverage summary
      shell: pwsh
      run: |
        $files = Get-ChildItem -Recurse -Filter 'coverage.cobertura.xml' | Where-Object { $_.FullName -notmatch '[\\/](obj|bin)[\\/]' }
        if (-not $files) { throw 'No cobertura coverage output found.' }
        foreach ($file in $files) {
          [xml]$report = Get-Content -Path $file.FullName -Raw
          $project = $file.Directory.Parent.Parent.Name
          Write-Host ""
          Write-Host "Coverage - test run under $project (from $($file.Directory.Name)):"
          Write-Host ("{0,-40} {1,10} {2,10}" -f 'Assembly', 'Line %', 'Branch %')
          foreach ($package in $report.coverage.packages.package) {
            $linePct = 100 * [double]$package.'line-rate'
            $branchPct = 100 * [double]$package.'branch-rate'
            Write-Host ("{0,-40} {1,9:N1} {2,9:N1}" -f $package.name, $linePct, $branchPct)
          }
        }
