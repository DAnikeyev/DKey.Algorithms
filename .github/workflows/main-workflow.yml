name: Main Workflow

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Execute unit tests
      run: dotnet test --configuration Release

    - name: Package project
      run: dotnet pack "DKey.Algorithms/DKey.Algorithms.csproj" --configuration Release --output packages

    - name: Check if package version is already published
      id: version_gate
      shell: pwsh
      run: |
        $csproj = Get-Content "DKey.Algorithms/DKey.Algorithms.csproj" -Raw
        $version = [regex]::Match($csproj, '<Version>([^<]+)</Version>').Groups[1].Value.Trim()
        if (-not $version) { throw "Could not read <Version> from DKey.Algorithms.csproj" }
        Write-Host "Package version: $version"
        $response = Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/dkey.algorithms/index.json" -ErrorAction Stop
        $alreadyPublished = $response.versions -contains $version
        Write-Host "Version $version already published on NuGet: $alreadyPublished"
        $shouldPublish = (-not $alreadyPublished).ToString().ToLowerInvariant()
        "should_publish=$shouldPublish" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Publish NuGet
      if: steps.version_gate.outputs.should_publish == 'true'
      shell: pwsh
      run: |
        $packages = Get-ChildItem packages -Filter *.nupkg -File -Name
        foreach ($package in $packages) {
          dotnet nuget push "packages/$package" -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate
        }

    - name: Skip NuGet publish (version already published)
      if: steps.version_gate.outputs.should_publish == 'false'
      run: echo "NuGet publish skipped: package version is already on nuget.org."
